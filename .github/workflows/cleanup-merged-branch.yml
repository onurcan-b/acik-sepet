name: One-off merged branch cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-merged-branch.yml"

permissions:
  contents: write

concurrency:
  group: acik-sepet-one-off-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Delete merged working branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/agent/source-aware-panel-renewal" || true
      - name: Remove this one-off workflow
        run: |
          git config user.name "acik-sepet-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/cleanup-merged-branch.yml
          git commit -m "chore: remove one-off cleanup workflow"
          git pull --rebase origin main
          git push origin main
