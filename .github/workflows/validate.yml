name: Validate Açık Sepet

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Rebuild published series and chart offline
        run: |
          python -m acik_sepet.index
          python -m acik_sepet.report
      - name: Lock published v0.4 baseline
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("data/v0.4/index.csv")
          with path.open(encoding="utf-8", newline="") as handle:
              rows = {row["date"]: row for row in csv.DictReader(handle)}

          anchors = {"2026-09-02": 100.0000}
          for day, expected in anchors.items():
              actual = float(rows[day]["index"])
              if abs(actual - expected) > 1e-4:
                  raise SystemExit(f"historical index changed on {day}: {actual} != {expected}")

          for name in ("index.svg", "coverage.svg", "basket.svg"):
              chart = Path("charts") / name
              if not chart.exists() or chart.stat().st_size < 1000:
                  raise SystemExit(f"analytics chart was not generated correctly: {name}")
          print("v0.4 baseline and charts are stable")
          PY
      - name: Live strict-matching collector smoke
        run: |
          python -m acik_sepet.collect
          python -m acik_sepet.validate --min-type-coverage 0.60 --min-skus 300
      - name: Source-file whitespace sanity
        run: git diff --check -- acik_sepet tests .github config README.md METHOD.md
