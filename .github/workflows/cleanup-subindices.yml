name: Final integration cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-subindices.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary integration branch
        run: |
          git config user.name "acik-sepet-bot"
          git config user.email "actions@users.noreply.github.com"
          git push origin --delete agent/subindices-wireup || true
          git rm .github/workflows/cleanup-subindices.yml
          git commit -m "chore: remove final cleanup workflow"
          git pull --rebase origin main
          git push origin main
