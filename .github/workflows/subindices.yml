name: Açık Sepet Alt Endeksleri

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "acik_sepet/subindices.py"
      - ".github/workflows/subindices.yml"
  workflow_run:
    workflows: ["Daily Açık Sepet"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: acik-sepet-subindices
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Generate subgroup indices
        run: python -m acik_sepet.subindices
      - name: Commit subgroup series
        run: |
          git config user.name "acik-sepet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/subindices.csv
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "data: alt endeksleri güncelle"
          git pull --rebase origin main
          git push origin main
