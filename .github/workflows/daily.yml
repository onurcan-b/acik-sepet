name: Daily Açık Sepet

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "acik_sepet/**"
      - "config/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/daily.yml"
  schedule:
    - cron: "45 5 * * *"

permissions:
  contents: write

concurrency:
  group: acik-sepet-daily
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests
        run: pytest -q
      - name: Collect multi-SKU panels
        run: python -m acik_sepet.collect_v03
      - name: Validate panel quality
        run: python -m acik_sepet.validate_v03 --min-type-coverage 0.60 --min-skus 300
      - name: Rebuild indices and README
        run: |
          python -m acik_sepet.index_v03
          python -m acik_sepet.report_v03
      - name: Commit updated observations
        run: |
          git config user.name "acik-sepet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/v0.3/ state/v0.3-panels.json charts/index.svg README.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "data: günlük Açık Sepet v0.3 güncellemesi"
          git pull --rebase origin main
          git push origin main
