name: Daily Açık Sepet

on:
  workflow_dispatch:
  schedule:
    - cron: "45 5 * * *"

permissions:
  contents: write

concurrency:
  group: acik-sepet-daily
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests
        run: pytest -q
      - name: Collect strict category-aware multi-SKU panels
        run: python -m acik_sepet.collect
      - name: Validate panel quality
        run: python -m acik_sepet.validate --min-type-coverage 0.60 --min-skus 300
      - name: Rebuild indices and README
        run: |
          python -m acik_sepet.index
          python -m acik_sepet.report
      - name: Guard v0.4 baseline and analytics charts
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          with Path("data/v0.4/index.csv").open(encoding="utf-8", newline="") as handle:
              rows = {row["date"]: row for row in csv.DictReader(handle)}

          anchors = {"2026-09-02": 100.0000}
          for day, expected in anchors.items():
              actual = float(rows[day]["index"])
              if abs(actual - expected) > 1e-4:
                  raise SystemExit(f"published history changed on {day}: {actual} != {expected}")

          for name in ("index.svg", "coverage.svg", "basket.svg"):
              chart = Path("charts") / name
              if not chart.exists() or chart.stat().st_size < 1000:
                  raise SystemExit(f"analytics chart was not generated correctly: {name}")
          print("v0.4 baseline and charts are stable")
          PY
      - name: Source-file whitespace sanity
        run: git diff --check -- acik_sepet tests .github config README.md METHOD.md
      - name: Commit updated observations
        run: |
          git config user.name "acik-sepet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/v0.4/ state/v0.4-panels.json charts/*.svg README.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "data: günlük Açık Sepet v0.4 güncellemesi"
          git pull --rebase origin main
          git push origin main
